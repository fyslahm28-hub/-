name: Build & Auto-Distribute Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      release_notes:
        description: "নতুন আপডেটের বিবরণ (Release Notes)"
        required: false
        default: "নতুন ফিচার, উন্নত পারফরম্যান্স ও বাগ ফিক্স যুক্ত করা হয়েছে।"

permissions:
  contents: write

jobs:
  build-and-distribute:
    name: Build APK & Publish GitHub Release
    runs-on: ubuntu-latest
    outputs:
      version_code: ${{ steps.version_meta.outputs.version_code }}
      version_name: ${{ steps.version_meta.outputs.version_name }}
      release_tag: ${{ steps.version_meta.outputs.release_tag }}
      apk_filename: ${{ steps.version_meta.outputs.apk_filename }}
      apk_download_url: ${{ steps.version_meta.outputs.apk_download_url }}
      apk_sha256: ${{ steps.build_apk.outputs.apk_sha256 }}
      apk_size_bytes: ${{ steps.build_apk.outputs.apk_size_bytes }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle Distribution & Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/dist-9.3.1
          key: ${{ runner.os }}-gradle-9.3.1-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-9.3.1-
            ${{ runner.os }}-gradle-

      - name: Setup Gradle 9.3.1 (Multi-Mirror Retry & 504 Protection)
        run: |
          GRADLE_VERSION="9.3.1"
          GRADLE_ROOT="$HOME/.gradle/dist-${GRADLE_VERSION}"
          GRADLE_BIN="${GRADLE_ROOT}/gradle-${GRADLE_VERSION}/bin"

          if [ -x "${GRADLE_BIN}/gradle" ]; then
            echo "Restored Gradle ${GRADLE_VERSION} from cache."
            echo "${GRADLE_BIN}" >> "$GITHUB_PATH"
            exit 0
          fi

          mkdir -p "${GRADLE_ROOT}"
          ZIP_FILE="/tmp/gradle-${GRADLE_VERSION}-bin.zip"
          rm -f "${ZIP_FILE}"

          MIRRORS=(
            "https://downloads.gradle-dn.com/distributions/gradle-${GRADLE_VERSION}-bin.zip"
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
            "https://mirrors.cloud.tencent.com/gradle/gradle-${GRADLE_VERSION}-bin.zip"
          )

          DOWNLOADED=false
          for URL in "${MIRRORS[@]}"; do
            echo "Attempting to download Gradle ${GRADLE_VERSION} from ${URL} ..."
            if curl -fL --connect-timeout 20 --max-time 180 --retry 5 --retry-delay 4 --retry-all-errors "${URL}" -o "${ZIP_FILE}"; then
              if unzip -tq "${ZIP_FILE}" >/dev/null 2>&1; then
                DOWNLOADED=true
                echo "Successfully downloaded and verified Gradle ${GRADLE_VERSION} from ${URL}"
                break
              fi
            fi
            echo "Mirror ${URL} failed or timed out (e.g. HTTP 504), trying next mirror..."
            rm -f "${ZIP_FILE}"
          done

          if [ "${DOWNLOADED}" = true ]; then
            unzip -q -o "${ZIP_FILE}" -d "${GRADLE_ROOT}"
            rm -f "${ZIP_FILE}"
            chmod +x "${GRADLE_BIN}/gradle"
            echo "${GRADLE_BIN}" >> "$GITHUB_PATH"
            "${GRADLE_BIN}/gradle" --version
          elif command -v gradle >/dev/null 2>&1; then
            echo "Using pre-installed runner Gradle as fallback:"
            gradle --version
          else
            echo "Failed to download Gradle from all mirrors."
            exit 1
          fi

      - name: Compute Release Version Metadata
        id: version_meta
        run: |
          VERSION_CODE=$((100 + ${{ github.run_number }}))
          VERSION_NAME="1.0.${{ github.run_number }}"
          RELEASE_TAG="v${VERSION_NAME}"
          APK_FILENAME="Qawmi-Kormosangsthan-Bangladesh.apk"
          APK_DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}/${APK_FILENAME}"
          echo "version_code=${VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "release_tag=${RELEASE_TAG}" >> $GITHUB_OUTPUT
          echo "apk_filename=${APK_FILENAME}" >> $GITHUB_OUTPUT
          echo "apk_download_url=${APK_DOWNLOAD_URL}" >> $GITHUB_OUTPUT

      - name: Ensure debug.keystore is available
        run: |
          if [ ! -f "debug.keystore" ] && [ -f "debug.keystore.base64" ]; then
            tr -d '[:space:]' < debug.keystore.base64 | base64 -d > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            DEFAULT_KEYSTORE_B64=""
            printf '%s' "${DEFAULT_KEYSTORE_B64}" | base64 -d > debug.keystore
          fi
          keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep -E "SHA1:|SHA256:"

      - name: Configure Firebase google-services.json
        env:
          GOOGLE_SERVICES_JSON_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
          DEFAULT_WEB_CLIENT_ID_SECRET: ${{ secrets.DEFAULT_WEB_CLIENT_ID }}
        run: |
          if [ -n "${GOOGLE_SERVICES_JSON_SECRET}" ]; then
            TEMP_GS_JSON="$(mktemp)"
            if echo "${GOOGLE_SERVICES_JSON_SECRET}" | grep -q '^[[:space:]]*{'; then
              printf '%s\n' "${GOOGLE_SERVICES_JSON_SECRET}" > "${TEMP_GS_JSON}"
            else
              echo "${GOOGLE_SERVICES_JSON_SECRET}" | tr -d '[:space:]' | base64 -d > "${TEMP_GS_JSON}" || true
            fi
            if grep -q '"com.aistudio.qawmikormo.szmbsk"' "${TEMP_GS_JSON}" && grep -q '"e7a326d7afd004ed2f0f354d5ff51227fb15a468"' "${TEMP_GS_JSON}"; then
              cp "${TEMP_GS_JSON}" app/google-services.json
              echo "Prepared validated app/google-services.json from GOOGLE_SERVICES_JSON secret."
            else
              echo "GOOGLE_SERVICES_JSON secret did not contain latest certificate hash; Gradle will materialize validated app/google-services.json."
            fi
            rm -f "${TEMP_GS_JSON}"
          elif [ -f "app/google-services.json" ]; then
            echo "Using existing app/google-services.json in repository."
          else
            echo "app/google-services.json will be materialized automatically by app/build.gradle.kts."
          fi

      - name: Build Debug APK with Release Version
        id: build_apk
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          DEFAULT_WEB_CLIENT_ID: ${{ secrets.DEFAULT_WEB_CLIENT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          for ATTEMPT in 1 2 3; do
            echo "Running gradle assembleDebug (Attempt ${ATTEMPT}/3)..."
            if gradle assembleDebug \
              -PversionCode=${{ steps.version_meta.outputs.version_code }} \
              -PversionName=${{ steps.version_meta.outputs.version_name }} \
              -Dorg.gradle.internal.http.connectionTimeout=120000 \
              -Dorg.gradle.internal.http.socketTimeout=120000 \
              --no-daemon; then
              break
            fi
            if [ "${ATTEMPT}" -eq 3 ]; then
              echo "Gradle build failed after 3 attempts."
              exit 1
            fi
            sleep 5
          done
          cp app/build/outputs/apk/debug/app-debug.apk ${{ steps.version_meta.outputs.apk_filename }}
          APK_SHA256=$(sha256sum "${{ steps.version_meta.outputs.apk_filename }}" | awk '{print $1}')
          APK_SIZE_BYTES=$(stat -c%s "${{ steps.version_meta.outputs.apk_filename }}" 2>/dev/null || wc -c < "${{ steps.version_meta.outputs.apk_filename }}" | tr -d ' ')
          echo "apk_sha256=${APK_SHA256}" >> $GITHUB_OUTPUT
          echo "apk_size_bytes=${APK_SIZE_BYTES}" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: Qawmi-Kormosangsthan-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            ${{ steps.version_meta.outputs.apk_filename }}

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_meta.outputs.release_tag }}
          name: "কওমি কর্মসংস্থান বাংলাদেশ ${{ steps.version_meta.outputs.version_name }}"
          body: |
            ### কওমি কর্মসংস্থান বাংলাদেশ — নতুন সংস্করণ ${{ steps.version_meta.outputs.version_name }} (Build #${{ steps.version_meta.outputs.version_code }})
            - **ভার্সন কোড**: `${{ steps.version_meta.outputs.version_code }}`
            - **ভার্সন নাম**: `${{ steps.version_meta.outputs.version_name }}`
            - **কমিট**: `${{ github.sha }}`
            - **সরাসরি ডাউনলোড লিংক**: ${{ steps.version_meta.outputs.apk_download_url }}
          files: |
            ${{ steps.version_meta.outputs.apk_filename }}
            app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Firebase App Distribution Configuration
        id: check_firebase_distribution
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "${FIREBASE_APP_ID}" ] && [ -n "${FIREBASE_SERVICE_ACCOUNT}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Distribute APK to Firebase App Distribution (Optional)
        if: steps.check_firebase_distribution.outputs.configured == 'true'
        continue-on-error: true
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: testers
          file: app/build/outputs/apk/debug/app-debug.apk
          releaseNotes: "কওমি কর্মসংস্থান বাংলাদেশ — সংস্করণ ${{ steps.version_meta.outputs.version_name }} (Commit: ${{ github.sha }})"

  sync-firebase-release-metadata:
    name: Sync & Verify Firebase Firestore Auto-Update (/app_releases/latest)
    needs: build-and-distribute
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js for Firebase Auto-Update Sync
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure Firebase google-services.json (If Provided via Secret)
        env:
          GOOGLE_SERVICES_JSON_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "${GOOGLE_SERVICES_JSON_SECRET}" ]; then
            TEMP_GS_JSON="$(mktemp)"
            if echo "${GOOGLE_SERVICES_JSON_SECRET}" | grep -q '^[[:space:]]*{'; then
              printf '%s\n' "${GOOGLE_SERVICES_JSON_SECRET}" > "${TEMP_GS_JSON}"
            else
              echo "${GOOGLE_SERVICES_JSON_SECRET}" | tr -d '[:space:]' | base64 -d > "${TEMP_GS_JSON}" || true
            fi
            if grep -q '"gen-lang-client-0048059944"' "${TEMP_GS_JSON}"; then
              cp "${TEMP_GS_JSON}" app/google-services.json
            fi
            rm -f "${TEMP_GS_JSON}"
          fi

      - name: Update & Verify Latest Version in Firebase Firestore (/app_releases/latest)
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          RELEASE_VERSION_CODE: ${{ needs.build-and-distribute.outputs.version_code }}
          RELEASE_VERSION_NAME: ${{ needs.build-and-distribute.outputs.version_name }}
          RELEASE_APK_URL: ${{ needs.build-and-distribute.outputs.apk_download_url }}
          RELEASE_APK_SHA256: ${{ needs.build-and-distribute.outputs.apk_sha256 }}
          RELEASE_APK_SIZE_BYTES: ${{ needs.build-and-distribute.outputs.apk_size_bytes }}
          RELEASE_TAG: ${{ needs.build-and-distribute.outputs.release_tag }}
          RELEASE_NOTES: ${{ github.event.inputs.release_notes || format('কওমি কর্মসংস্থান বাংলাদেশ নতুন সংস্করণ {0} প্রকাশিত হয়েছে। উন্নত ফিড, দ্রুততর পারফরম্যান্স ও বাগ ফিক্স যুক্ত করা হয়েছে।', needs.build-and-distribute.outputs.version_name) }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          node scripts/publish-release-to-firebase.mjs \
            --version-code "${RELEASE_VERSION_CODE}" \
            --version-name "${RELEASE_VERSION_NAME}" \
            --apk-url "${RELEASE_APK_URL}" \
            --apk-sha256 "${RELEASE_APK_SHA256}" \
            --apk-size-bytes "${RELEASE_APK_SIZE_BYTES}" \
            --release-tag "${RELEASE_TAG}" \
            --commit-sha "${GITHUB_SHA}" \
            --release-notes "${RELEASE_NOTES}" \
            --release-status "PUBLISHED" \
            --mandatory "true" \
            --require-service-account false
